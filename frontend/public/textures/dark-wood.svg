<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241811"/>
      <stop offset="100%" stop-color="#140d09"/>
    </linearGradient>
    <linearGradient id="plankShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#b8863b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b8863b" stop-opacity="0"/>
    </radialGradient>
    <filter id="grainH" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.35" numOctaves="3" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.3
                0 0 0 0 0.12
                0 0 0 0.35 0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#woodBase)"/>

  <!-- planks -->
  <g>
    <rect x="0" y="0" width="200" height="800" fill="url(#plankShade)"/>
    <rect x="200" y="0" width="200" height="800" fill="url(#plankShade)"/>
    <rect x="400" y="0" width="200" height="800" fill="url(#plankShade)"/>
    <rect x="600" y="0" width="200" height="800" fill="url(#plankShade)"/>
    <rect x="800" y="0" width="200" height="800" fill="url(#plankShade)"/>
    <rect x="1000" y="0" width="200" height="800" fill="url(#plankShade)"/>
  </g>

  <!-- grain -->
  <rect width="1200" height="800" filter="url(#grainH)" opacity="0.6" style="mix-blend-mode:overlay"/>

  <!-- knots -->
  <g stroke="#0c0805" fill="none" opacity="0.5">
    <ellipse cx="150" cy="520" rx="22" ry="14" stroke-width="2"/>
    <ellipse cx="150" cy="520" rx="12" ry="7" stroke-width="1.5"/>
    <ellipse cx="870" cy="180" rx="18" ry="11" stroke-width="2"/>
    <ellipse cx="870" cy="180" rx="9" ry="5" stroke-width="1.5"/>
  </g>

  <!-- candlelight glow -->
  <rect width="1200" height="800" fill="url(#candleGlow)"/>
</svg>
